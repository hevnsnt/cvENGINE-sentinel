# Creates a release tag (annotated) on a commit of main. The scanner library's version is its git tag (setuptools-scm), and cvENGINE pins
# the library by that tag, so cutting a library release is: merge to main, then run this workflow with the version. Run by hand only.
name: Tag a release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create, vMAJOR.MINOR.PATCH (for example v1.4.0)"
        required: true
      ref:
        description: "Commit of main to tag (a full SHA); empty tags the tip of main"
        required: false
        default: ""
      tools_reviewed:
        description: "A tool is behind its newest release and that was looked at and decided (say why in the release notes): tag anyway"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  # The release gate: every pinned tool is at its newest release (scripts/check_tool_versions.py), and a pin it cannot read or a lookup that fails counts
  # as behind. Checked on the commit being tagged.
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || 'main' }}
      - name: Every pinned tool is at its newest release, or tools_reviewed was ticked
        env:
          REVIEWED: ${{ inputs.tools_reviewed }}
          GITHUB_TOKEN: ${{ github.token }}  # for api.github.com lookups: unauthenticated they are rate limited on shared runners
        run: |
          if python3 scripts/check_tool_versions.py --fail-if-behind --github-warnings; then
            exit 0
          fi
          if [ "$REVIEWED" = "true" ]; then
            echo "::warning::A tool is behind its newest release; tools_reviewed says that was looked at."
            exit 0
          fi
          echo "::error::A pinned tool is behind its newest release, a pin is missing or a newest version could not be read (table above). Bump the pin or fix the lookup, or run again with tools_reviewed after deciding not to."
          exit 1

  tag:
    needs: tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - name: Create and push the tag
        env:
          TAG: ${{ inputs.tag }}
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::the tag must look like v1.4.0"; exit 1; }
          target=$(git rev-parse --verify "${REF:-origin/main}^{commit}")
          # only a commit that is on main can be released
          git merge-base --is-ancestor "$target" origin/main || { echo "::error::$target is not on main"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then echo "::error::$TAG exists already"; exit 1; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$target" -m "Release $TAG"
          git push origin "refs/tags/$TAG"
          echo "Tagged $TAG at $target" >> "$GITHUB_STEP_SUMMARY"
