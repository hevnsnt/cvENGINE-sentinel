name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  client:
    name: Client tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt ".[test]"
      - run: python -m unittest discover -s client/tests -t .

  # The library's floor is Python 3.12 (the cvENGINE server imports it and runs 3.12); the client runs in the image, which is 3.14.
  library:
    name: Library tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install ".[test]"
      - run: python -m unittest discover -s cvengine_scanner/tests -t .
      - name: The installed package carries the contract and the fixtures
        run: |
          pip install .
          cd "$RUNNER_TEMP"
          python -I - <<'PY'
          import cvengine_scanner
          from cvengine_scanner import contract
          assert 'site-packages' in cvengine_scanner.__file__, cvengine_scanner.__file__
          print('cvengine-scanner', cvengine_scanner.__version__, 'contract', contract.version())
          for half in ('results', 'targets', 'results/v1'):
              assert sorted((contract.FIXTURES / half).glob('*.json')), half
          from cvengine_scanner.probes import dns, policy, version_probes  # the probes, with no dependency of their own
          assert 'site-packages' in version_probes.__file__, version_probes.__file__
          from cvengine_scanner import nmap  # the one runtime dependency (xmltodict) came with the install
          assert nmap.parse_xml('<nmaprun><host><status state="up"/><address addr="192.0.2.1" addrtype="ipv4"/></host></nmaprun>') is not None
          PY

  # The cvENGINE server pins the library the way this job installs it: `cvengine-scanner @ git+https://...cvENGINE-sentinel@<tag>` in its
  # web/requirements.txt. A tag must give a package whose version is the tag, with the contract and the fixtures inside.
  install-from-tag:
    name: Installs from a git tag (the server's pin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Tag this commit locally and install it by git URL
        run: |
          git -c user.name=ci -c user.email=ci@example.com tag -a v99.0.0 -m "CI install check, never pushed"
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q "cvengine-scanner @ git+file://$GITHUB_WORKSPACE@v99.0.0"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/python" -I - <<'PY'
          import cvengine_scanner
          from cvengine_scanner import contract, fingerprint, flags, nmap, parsers
          assert cvengine_scanner.__version__ == '99.0.0', cvengine_scanner.__version__
          assert (contract.FIXTURES / 'results' / 'v1' / 'nmap.json').is_file()
          assert flags.NUCLEI_FLAGS[flags.NUCLEI_FLAGS.index('-etags') + 1] == 'dos'
          print('installed', cvengine_scanner.__version__, 'contract', contract.version())
          PY
      - name: Install by commit sha (the server's pin since T7, no tag needed) and read the contract
        run: |
          sha=$(git rev-parse HEAD)
          python -m venv "$RUNNER_TEMP/venv-sha"
          "$RUNNER_TEMP/venv-sha/bin/pip" install -q "cvengine-scanner @ git+file://$GITHUB_WORKSPACE@$sha"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv-sha/bin/python" -I -c "from cvengine_scanner import contract; print('contract', contract.version(), len(contract.load()['kind_since']), 'kinds'); assert contract.PATH.is_file()"

  # The secrets_scan kind runs Kingfisher (cvENGINE docs/SECRETS-PLAN.md 6.3). The pinned release tarballs are verified here the way Kingfisher
  # documents (docs/INSTALLATION.md, "Verifying release artifacts"): the build attestation, then the sha256 the Dockerfile pins. Then the real
  # binary: every flag the client passes exists, and a detection pass finds the synthetic secrets with no network at all (a namespace with no route).
  kingfisher:
    name: Kingfisher (pinned, attested, offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt ".[test]"
      - name: The pinned release, its attestation and its sha256 (both architectures)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(grep -m1 '^ARG KINGFISHER_VERSION=' Dockerfile | cut -d= -f2)
          dir="$RUNNER_TEMP/kingfisher"
          mkdir -p "$dir" && cd "$dir"
          gh release download "v$version" --repo mongodb/kingfisher --pattern kingfisher-linux-x64.tgz --pattern kingfisher-linux-arm64.tgz \
            --pattern multiple.intoto.jsonl
          for arch in x64:AMD64 arm64:ARM64; do
            asset="kingfisher-linux-${arch%%:*}.tgz"
            gh attestation verify "$asset" --repo mongodb/kingfisher --signer-workflow mongodb/kingfisher/.github/workflows/release.yml \
              --source-ref "refs/tags/v$version" --bundle multiple.intoto.jsonl
            pinned=$(grep -m1 "^ARG KINGFISHER_SHA256_${arch##*:}=" "$GITHUB_WORKSPACE/Dockerfile" | cut -d= -f2)
            printf '%s  %s\n' "$pinned" "$asset" | sha256sum --check
          done
          mkdir bin && tar -xzf kingfisher-linux-x64.tgz -C bin
          printf 'CVENGINE_KINGFISHER_BIN=%s\n' "$dir/bin/kingfisher" >> "$GITHUB_ENV"
      - name: The flags, the version pin and a detection pass over synthetic pages
        env:
          CVENGINE_KINGFISHER_REAL: '1'
        run: python -m unittest client.tests.test_secrets_kingfisher -v
      - name: The detection pass needs no network (a network namespace with no route)
        run: sudo -E env "PATH=$PATH" CVENGINE_KINGFISHER_REAL=1 CVENGINE_KINGFISHER_BIN="$CVENGINE_KINGFISHER_BIN" unshare --net -- python -m unittest client.tests.test_secrets_kingfisher.DetectionTests -v
      - name: A newer Kingfisher release (a warning, never a failure)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pinned=$(grep -m1 '^ARG KINGFISHER_VERSION=' Dockerfile | cut -d= -f2)
          latest=$(gh api 'repos/mongodb/kingfisher/releases/latest' --jq .tag_name 2>/dev/null || true)
          if [ -n "$latest" ] && [ "${latest#v}" != "$pinned" ]; then
            echo "::warning::Kingfisher $latest is out; the image pins $pinned. Bump the version and both sha256 pins, and re-review the server's validation allow-list."
          fi

  # This library is the one source of truth for the result contract (cvengine_scanner/contract/sentinel_contract.json). The server keeps no copy: it
  # installs this library at the commit sha it pins in web/requirements.txt. A contract change lands here first, then the server bumps its sha.
  # So this job no longer compares files. It runs the contract's own self-tests, and checks that the sha the server pins is a commit of this
  # repository's main (an ancestor of it, or main itself), so the server never pins a commit that was dropped or is not merged. While the server
  # still pins a tag (before its T7 change merges) there is no sha to check and the check passes: neither pull request waits on the other.
  contract:
    name: Contract self-tests and the server's pinned sha is on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: The contract's own self-tests (schema, one fixture per kind, targets, partials, frozen sets)
        run: |
          pip install -r requirements.txt ".[test]"
          python -m unittest cvengine_scanner.tests.test_contract -v
      - name: The sha the server pins is on main
        env:
          SERVER_REQUIREMENTS_URL: https://raw.githubusercontent.com/hevnsnt/CVEngine/1.4-develop/web/requirements.txt
        run: |
          reqs="$RUNNER_TEMP/server_requirements.txt"
          # Fails closed: a file that cannot be fetched (after three tries with a growing wait) fails the job, because a skipped check would let a
          # pin to an unmerged commit through unnoticed.
          fetched=0
          for attempt in 1 2 3; do
            rm -f "$reqs"
            if curl -fsSL --max-time 30 -o "$reqs" "$SERVER_REQUIREMENTS_URL" && grep -q '^cvengine-scanner' "$reqs"; then
              fetched=1
              break
            fi
            echo "attempt $attempt of 3: could not fetch $SERVER_REQUIREMENTS_URL"
            [ "$attempt" -lt 3 ] && sleep $((attempt * 10))
          done
          if [ "$fetched" -ne 1 ]; then
            echo "::error::could not fetch the server's web/requirements.txt after 3 attempts; the check cannot be made, so it fails (re-run it when the file is reachable)"
            exit 1
          fi
          pin=$(grep '^cvengine-scanner' "$reqs" | sed 's/[[:space:]]*#.*//')
          echo "the server pins: $pin"
          ref=${pin##*@}
          if ! printf '%s' "$ref" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "the server pins '$ref', not a commit sha: nothing to compare (the server still pins a release tag)"
            exit 0
          fi
          git fetch -q origin main
          if ! git cat-file -e "$ref^{commit}" 2>/dev/null; then
            echo "::error::the server pins $ref, which is not a commit of this repository"
            exit 1
          fi
          if git merge-base --is-ancestor "$ref" origin/main; then
            echo "the server's pin $ref is on main ($(git rev-parse --short origin/main) or an ancestor of it)"
          else
            echo "::error::the server pins $ref, which is not an ancestor of (or equal to) main: merge the contract change here first, then bump the server's pin to a main commit"
            exit 1
          fi

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Scripts parse
        run: |
          for f in scripts/*.sh docker-entrypoint.sh; do sh -n "$f"; done
          bash -n setup.sh
      - name: shellcheck
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q shellcheck; }
          shellcheck --severity=warning scripts/*.sh docker-entrypoint.sh setup.sh

  compose:
    name: Compose file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Light (no profile)
        run: docker compose config -q
      - name: Full (openvas profile)
        run: docker compose config -q
        env:
          COMPOSE_PROFILES: openvas
