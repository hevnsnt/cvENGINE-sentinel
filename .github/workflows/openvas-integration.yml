name: OpenVAS integration

# Brings up the pinned Greenbone gvmd and runs the Sentinel's login bootstrap and readiness check against it, because a mock cannot catch gvmd
# refusing a request python-gvm builds (the default user changing its own password answered "Failed to find user", 404, and shipped untested).
# It does NOT run a scan: a scan needs the vulnerability-test feeds, which take hours and tens of GB to sync; see README.md, "Testing OpenVAS".
# Runs when the OpenVAS client, the compose pins or the pinned python-gvm change, weekly (Greenbone replaces what its images point to), and on demand.
on:
  pull_request:
    paths:
      - client/openvas.py
      - client/tools.py
      - docker-compose.yml
      - requirements.txt
      - scripts/ci_openvas_bootstrap.py
      - .github/workflows/openvas-integration.yml
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    name: gvmd login bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: sentinelci
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (the Greenbone data images are large)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
          docker system prune -af >/dev/null
          df -h /
      - name: Pinned digests still exist
        run: ./scripts/greenbone-digests.sh | tee digests.txt; ! grep -q '^CHANGED' digests.txt
      - name: Start gvmd and what it needs
        run: docker compose up -d openvas-gvmd
      - name: Wait for gvmd's socket
        run: |
          for i in $(seq 1 120); do
            if docker run --rm -v sentinelci_openvas_gvmd_socket_vol:/run/gvmd alpine test -S /run/gvmd/gvmd.sock; then echo "gvmd is up after $((i * 15))s"; exit 0; fi
            sleep 15
          done
          docker compose ps; docker compose logs --tail=80 openvas-gvmd; exit 1
      - name: Bootstrap the login with the pinned python-gvm against the pinned gvmd
        run: |
          PYGVM=$(grep -o 'python-gvm==[0-9.]*' requirements.txt)
          docker run --rm -v "$PWD":/app -w /app -v sentinelci_openvas_gvmd_socket_vol:/run/gvmd \
            -e CVENGINE_OPENVAS_CREDENTIALS_FILE=/tmp/openvas-credentials.json python:3.13-slim \
            sh -c "pip install -q $PYGVM && python scripts/ci_openvas_bootstrap.py"
      - name: gvmd logs on failure
        if: failure()
        run: docker compose logs --tail=120 openvas-gvmd
