name: Image

# Builds the Sentinel image the way an operator's `docker compose build` does (loaded locally, never pushed) and runs a smoke command in it,
# because a broken Dockerfile would otherwise first show up on every Sentinel that updates automatically.
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - requirements.txt
      - pyproject.toml
      - client/**
      - cvengine_scanner/**
      - docker-compose.yml
      - docker-entrypoint.sh
      - docker/**
      - scripts/**
      - .github/workflows/image.yml
      - .github/workflows/publish.yml
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - requirements.txt
      - pyproject.toml
      - client/**
      - cvengine_scanner/**
      - docker-compose.yml
      - docker-entrypoint.sh
      - docker/**
      - scripts/**
      - .github/workflows/image.yml
      - .github/workflows/publish.yml
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    # each architecture builds on a native runner (the server repository's build-pr.yml does the same; arm64 under QEMU takes hours)
    name: Build and smoke-test the Sentinel image${{ matrix.arch == 'arm64' && ' (arm64)' || '' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build (no push)
        run: docker buildx build --load -t cvengine-sentinel-local:ci .
      - name: The control CLI answers with JSON
        run: docker run --rm --entrypoint python3 cvengine-sentinel-local:ci -m client.control status | python3 -m json.tool
      - name: The image reports the commit it was built from
        run: |
          stamped=$(docker run --rm --entrypoint python3 cvengine-sentinel-local:ci -c "from client import config; print(config.version())")
          echo "image version: $stamped"
          test "$stamped" = "$(git rev-parse --short=12 HEAD)"
      - name: The scanner library is installed in the image, not read from the working directory
        run: |
          docker run --rm --entrypoint python3 cvengine-sentinel-local:ci -c "
          import cvengine_scanner
          from cvengine_scanner import contract
          assert '/opt/venv/' in cvengine_scanner.__file__, cvengine_scanner.__file__
          print('cvengine-scanner', cvengine_scanner.__version__, 'contract', contract.version())"
      - name: wafw00f runs as the image's unprivileged user and the client declares the waf kind
        run: |
          docker run --rm --entrypoint wafw00f cvengine-sentinel-local:ci --version | grep -F "$(grep -m1 '^ARG WAFW00F_VERSION=' Dockerfile | cut -d= -f2)"
          docker run --rm --entrypoint python3 cvengine-sentinel-local:ci -c "from client import config, tools; assert 'waf' in config.CAPABILITIES and 'bbot_discovery' in config.CAPABILITIES; assert 'bbot' in tools.detect_tools(); print('contract', config.CONTRACT_VERSION)"
      - name: bbot runs as the image's unprivileged user, from its own home
        run: |
          docker run --rm --entrypoint bbot cvengine-sentinel-local:ci --version | grep -F "$(grep -m1 '^ARG BBOT_VERSION=' Dockerfile | cut -d= -f2)"
          docker run --rm --entrypoint sh cvengine-sentinel-local:ci -c 'test -w "$HOME/.bbot" && echo "bbot home: $HOME/.bbot"'
      - name: The contract 3 kinds' packages import, and the toolchain that built them stayed in the wheels stage
        run: |
          docker run --rm --entrypoint python3 cvengine-sentinel-local:ci -c "
          import arc4, h11, pymongo, pymysql, redis
          from aardwolf.commons.factory import RDPConnectionFactory
          from client import config, rdp, tools
          from client.vendor import node2shell
          assert rdp.available()
          assert {'nmap_full', 'nmap_verify', 'node2shell', 'rdp_shot', 'db_probe', 'path_probe', 'nuclei_validate'} <= set(tools.RUNNERS) & set(config.CAPABILITIES)
          print('contract 3 kinds ready')"
          docker run --rm --entrypoint sh cvengine-sentinel-local:ci -c '! command -v rustc && ! command -v cargo && ! ls /usr/include/python3*/Python.h 2>/dev/null'
      - name: The OpenVAS bootstrap check is in the image
        run: docker run --rm --entrypoint test cvengine-sentinel-local:ci -f /opt/sentinel/scripts/ci_openvas_bootstrap.py
      - name: WPScan is the pinned version, from the locked gems, and its database is not baked in
        run: |
          docker run --rm --entrypoint wpscan cvengine-sentinel-local:ci --version | grep -F "$(grep -m1 '^ARG WPSCAN_VERSION=' Dockerfile | cut -d= -f2)"
          docker run --rm --entrypoint sh cvengine-sentinel-local:ci -c '! ls /home/sentinel/.wpscan/db/*.json >/dev/null 2>&1' \
            || { echo "::error::the image carries a WPScan database fetched at build time"; exit 1; }
      - name: The image carries no git, Go, GVM stack or docker socket
        run: |
          docker run --rm --entrypoint sh cvengine-sentinel-local:ci -c '
            bad=""
            for tool in git go gvmd openvas ospd-openvas docker; do command -v "$tool" >/dev/null 2>&1 && bad="$bad $tool"; done
            [ -e /usr/local/go ] && bad="$bad /usr/local/go"
            [ -e /root/go ] && bad="$bad /root/go"
            [ -S /var/run/docker.sock ] && bad="$bad docker.sock"
            [ -z "$bad" ] || { echo "the image carries:$bad"; exit 1; }'
      - name: The image declares its health check
        run: docker inspect --format '{{json .Config.Healthcheck.Test}}' cvengine-sentinel-local:ci | grep -F 'client.control'
