name: Image

# Builds the Sentinel image the way an operator's `docker compose build` does (loaded locally, never pushed) and runs a smoke command in it,
# because a broken Dockerfile would otherwise first show up on every Sentinel that updates automatically.
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - requirements.txt
      - pyproject.toml
      - client/**
      - cvengine_scanner/**
      - docker-compose.yml
      - docker-entrypoint.sh
      - docker/**
      - scripts/**
      - .github/workflows/image.yml
      - .github/workflows/publish.yml
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - requirements.txt
      - pyproject.toml
      - client/**
      - cvengine_scanner/**
      - docker-compose.yml
      - docker-entrypoint.sh
      - docker/**
      - scripts/**
      - .github/workflows/image.yml
      - .github/workflows/publish.yml
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    # each architecture builds on a native runner (the server repository's build-pr.yml does the same; arm64 under QEMU takes hours)
    name: Build and smoke-test the Sentinel image${{ matrix.arch == 'arm64' && ' (arm64)' || '' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build (no push)
        run: docker buildx build --load -t cvengine-sentinel-local:ci .
      - name: The control CLI answers with JSON
        run: docker run --rm --entrypoint python3 cvengine-sentinel-local:ci -m client.control status | python3 -m json.tool
      - name: The image reports the commit it was built from
        run: |
          stamped=$(docker run --rm --entrypoint python3 cvengine-sentinel-local:ci -c "from client import config; print(config.version())")
          echo "image version: $stamped"
          test "$stamped" = "$(git rev-parse --short=12 HEAD)"
      - name: The scanner library is installed in the image, not read from the working directory
        run: |
          docker run --rm --entrypoint python3 cvengine-sentinel-local:ci -c "
          import cvengine_scanner
          from cvengine_scanner import contract
          assert '/opt/venv/' in cvengine_scanner.__file__, cvengine_scanner.__file__
          print('cvengine-scanner', cvengine_scanner.__version__, 'contract', contract.version())"
      - name: wafw00f runs as the image's unprivileged user and the client declares the waf kind
        run: |
          docker run --rm --entrypoint wafw00f cvengine-sentinel-local:ci --version | grep -F "$(grep -m1 '^ARG WAFW00F_VERSION=' Dockerfile | cut -d= -f2)"
          docker run --rm --entrypoint python3 cvengine-sentinel-local:ci -c "from client import config, tools; assert 'waf' in config.CAPABILITIES and 'bbot_discovery' in config.CAPABILITIES; assert 'bbot' in tools.detect_tools(); print('contract', config.CONTRACT_VERSION)"
      - name: bbot runs as the image's unprivileged user, from its own home
        run: |
          docker run --rm --entrypoint bbot cvengine-sentinel-local:ci --version | grep -F "$(grep -m1 '^ARG BBOT_VERSION=' Dockerfile | cut -d= -f2)"
          docker run --rm --entrypoint sh cvengine-sentinel-local:ci -c 'test -w "$HOME/.bbot" && echo "bbot home: $HOME/.bbot"'
      - name: The contract 3 kinds' packages import, and the toolchain that built them stayed in the wheels stage
        run: |
          docker run --rm --entrypoint python3 cvengine-sentinel-local:ci -c "
          import arc4, h11, pymongo, pymysql, redis
          from aardwolf.commons.factory import RDPConnectionFactory
          from client import config, rdp, tools
          from client.vendor import node2shell
          assert rdp.available()
          assert {'nmap_full', 'nmap_verify', 'node2shell', 'rdp_shot', 'db_probe', 'path_probe', 'nuclei_validate'} <= set(tools.RUNNERS) & set(config.CAPABILITIES)
          print('contract 3 kinds ready')"
          docker run --rm --entrypoint sh cvengine-sentinel-local:ci -c '! command -v rustc && ! command -v cargo && ! ls /usr/include/python3*/Python.h 2>/dev/null'
      - name: The scanner library is installed and reports the version its build tools derive (setuptools-scm is its build backend)
        # The build context has no git tag, so setuptools-scm must fall back to pyproject.toml's fallback_version. A bump of setuptools or setuptools-scm
        # that changed how the version is derived (or broke the build without failing it) shows here.
        run: |
          expected="$(grep -m1 '^fallback_version' pyproject.toml | cut -d'"' -f2)"
          test -n "$expected"
          docker run --rm --entrypoint python3 cvengine-sentinel-local:ci -c "
          from importlib import metadata
          import cvengine_scanner
          installed = metadata.version('cvengine-scanner')
          print('cvengine-scanner', installed)
          assert installed == '$expected', (installed, '$expected')
          assert cvengine_scanner.__version__ == '$expected', cvengine_scanner.__version__"
      - name: Kingfisher runs as the image's unprivileged user, with its notices, and the client declares secrets_scan
        run: |
          docker run --rm --entrypoint kingfisher cvengine-sentinel-local:ci --version
          docker run --rm --entrypoint test cvengine-sentinel-local:ci -f /usr/share/doc/kingfisher/NOTICE
          docker run --rm --entrypoint python3 cvengine-sentinel-local:ci -c "from client import tools; assert tools.kingfisher_ready(); assert 'secrets_scan' in tools.RUNNERS"
      - name: sshamble runs as the image's unprivileged user, with its licence, and the client declares ssh_probe
        run: |
          docker run --rm --entrypoint sh cvengine-sentinel-local:ci -c "sshamble scan --help 2>&1 | grep -q -- --checks"
          docker run --rm --entrypoint test cvengine-sentinel-local:ci -f /usr/share/doc/sshamble/LICENSE.md
          docker run --rm --entrypoint python3 cvengine-sentinel-local:ci -c "from client import tools; assert tools.sshamble_ready(); assert 'ssh_probe' in tools.RUNNERS"
      - name: Chromium is the pinned build, runs as the image's unprivileged user, and the client declares web_screenshot
        run: |
          docker run --rm --entrypoint python3 cvengine-sentinel-local:ci -c "
          import sys
          from client import config, shot, tools
          assert shot.available(), 'the headless shell is not installed'
          assert 'web_screenshot' in tools.RUNNERS and 'web_screenshot' in config.CAPABILITIES
          print('playwright', shot.pinned_browser())
          sys.exit(0 if shot.pinned_browser().get('version') == '$(grep -m1 '^ARG PLAYWRIGHT_CHROMIUM_VERSION=' Dockerfile | cut -d= -f2)' else 1)"
          docker run --rm --entrypoint sh cvengine-sentinel-local:ci -c '! ls /opt/pw-browsers/ffmpeg-* >/dev/null 2>&1'
      # Chromium's sandbox cannot be proven by the build (build steps run under the builder's default seccomp profile, which refuses user namespaces).
      # Run the image the way the compose file runs the Sentinel: with Playwright's seccomp profile the sandbox must engage (client.shot_child --probe: the
      # renderer in its own user and PID namespace, under its own seccomp filter); with Docker's default profile it must fail closed (engaged false, exit
      # status 1), never fall back to running without it.
      - name: Screenshot browser sandbox
        run: |
          probe() { docker run --rm "$@" --entrypoint python3 cvengine-sentinel-local:ci -m client.shot_child --probe; }
          probe --security-opt seccomp=config/seccomp/playwright-chromium.json | tee "$RUNNER_TEMP/sandbox-on.json"
          grep -q '"engaged":true' "$RUNNER_TEMP/sandbox-on.json" || { echo "::error::Chromium's sandbox did not engage with the seccomp profile"; exit 1; }
          status=0; probe > "$RUNNER_TEMP/sandbox-off.json" || status=$?  # no pipe: the probe's own exit status is what counts
          cat "$RUNNER_TEMP/sandbox-off.json"
          [ "$status" = 1 ] && grep -q '"engaged":false' "$RUNNER_TEMP/sandbox-off.json" || { echo "::error::without the profile the browser did not fail closed (status $status)"; exit 1; }
      - name: The browser takes a picture of a page, inside its sandbox, through the vetting proxy
        run: |
          docker run --rm --security-opt seccomp=config/seccomp/playwright-chromium.json -v "$PWD/client/tests:/opt/sentinel/client/tests:ro" --entrypoint python3 cvengine-sentinel-local:ci -m unittest client.tests.test_shot_browser -v 2>&1 | tee "$RUNNER_TEMP/browser-tests.txt"
          grep -q 'skipped' "$RUNNER_TEMP/browser-tests.txt" && { echo "::error::the browser tests were skipped"; exit 1; } || true
      # The scans, run in the built image the way an operator's Sentinel runs: through docker-compose.yml's own sentinel service (every capability dropped but
      # NET_RAW and SYS_CHROOT, Playwright's seccomp profile), as uid 10001, against the container's own loopback only
      # (scripts/ci_scan_smoke.sh starts a web server and a TLS server there). This is the regression run for the capability set:
      # a tool that needs a capability the service dropped fails here. docker compose run uses the service definition itself
      # (--no-deps leaves out the OpenVAS stack and the one-shot that hands over the state volume, whose ownership the image already sets).
      - name: Where the tools write (informational, root left writable), by docker diff after the same scans
        continue-on-error: true
        run: |
          docker run --name write-set --cap-drop ALL --cap-add NET_RAW --security-opt seccomp=config/seccomp/playwright-chromium.json -v "$PWD/scripts/ci_scan_smoke.sh:/ci/smoke.sh:ro" -v "$PWD/client/tests:/opt/sentinel/client/tests:ro" --entrypoint sh cvengine-sentinel-local:ci -c 'sh /ci/smoke.sh; python3 -m unittest client.tests.test_daemon client.tests.test_control client.tests.test_spool client.tests.test_templates client.tests.test_badkeys client.tests.test_secrets_scan client.tests.test_shot_browser 2>&1 | tail -n 5' || true
          echo "=== files the container wrote or changed (docker diff, /tmp and /ci left out):"
          docker diff write-set | grep -Ev ' /(tmp|ci)(/|$)' || true
          docker rm write-set
      - name: Chromium's sandbox with every capability dropped, and with each one added back (informational)
        continue-on-error: true
        run: |
          for extra in NONE SYS_CHROOT SETUID SETGID SETPCAP CHOWN DAC_OVERRIDE KILL SYS_ADMIN; do
            add=(--cap-add NET_RAW); [ "$extra" = NONE ] || add+=(--cap-add "$extra")
            echo "=== cap_drop ALL, add NET_RAW + $extra"
            docker run --rm --cap-drop ALL "${add[@]}" --security-opt seccomp=config/seccomp/playwright-chromium.json --entrypoint python3 cvengine-sentinel-local:ci -m client.shot_child --probe 2>&1 | cut -c1-1500 | tail -n 3 || true
          done
      - name: The scans run under the compose service's capability set
        run: |
          docker tag cvengine-sentinel-local:ci cvengine-sentinel-local:latest
          # the service's own definition, with its build policy set to "never" so compose uses the image just built instead of building it again
          printf 'services:\n  sentinel:\n    pull_policy: never\n' > "$RUNNER_TEMP/ci-no-build.yml"
          export COMPOSE_FILE="docker-compose.yml:$RUNNER_TEMP/ci-no-build.yml"
          echo "COMPOSE_FILE=$COMPOSE_FILE" >> "$GITHUB_ENV"
          docker compose run --rm --no-deps -T -v "$PWD/scripts/ci_scan_smoke.sh:/ci/smoke.sh:ro" --entrypoint sh sentinel /ci/smoke.sh 2>&1 | tee "$RUNNER_TEMP/scan-smoke.txt"
          grep -q '^SMOKE OK' "$RUNNER_TEMP/scan-smoke.txt" || { echo "::error::a scan did not work under the compose service's settings"; exit 1; }
      - name: The client's own tests pass in the image under the same settings (daemon, state files, spool, templates, secrets) and so does the browser
        run: |
          docker compose run --rm --no-deps -T -v "$PWD/client/tests:/opt/sentinel/client/tests:ro" --entrypoint python3 sentinel -m unittest \
            client.tests.test_daemon client.tests.test_control client.tests.test_spool client.tests.test_templates client.tests.test_badkeys \
            client.tests.test_secrets_scan client.tests.test_selfupdate 2>&1 | tee "$RUNNER_TEMP/image-tests.txt"
          grep -q '^OK' "$RUNNER_TEMP/image-tests.txt" || { echo "::error::the client's tests failed in the image under the compose service's settings"; exit 1; }
          docker compose run --rm --no-deps -T -v "$PWD/client/tests:/opt/sentinel/client/tests:ro" --entrypoint python3 sentinel -m unittest client.tests.test_shot_browser -v 2>&1 | tee "$RUNNER_TEMP/browser-tests-ro.txt"
          grep -q '^OK' "$RUNNER_TEMP/browser-tests-ro.txt" || { echo "::error::the browser tests failed under the compose service's settings"; exit 1; }
          grep -q 'skipped' "$RUNNER_TEMP/browser-tests-ro.txt" && { echo "::error::the browser tests were skipped"; exit 1; } || true
      # The two settings that were left out, with the evidence: NET_ADMIN is not needed (the step above passes without it), and no-new-privileges makes the
      # kernel ignore the file capabilities nmap and naabu carry, so the same scan must FAIL under it. If this step ever passes the scan, no-new-privileges
      # can be added to docker-compose.yml.
      # read_only: true was tried. Everything the scans write works with a read-only root and memory-backed ~/.config, ~/.cache, ~/.bbot/{cache,logs,temp}
      # and /tmp (the same smoke passed that way), except bbot's discovery: it creates a working directory inside ~/.bbot/tools, where the image keeps 907 MB of
      # tools installed at build, and a scan dies at once when that is read-only. This step shows it (it is expected to fail; if it ever passes, read_only can
      # be set in docker-compose.yml).
      - name: Why the root filesystem is not read-only (informational, expected to fail)
        continue-on-error: true
        run: |
          docker run --rm --read-only --tmpfs /tmp --tmpfs /home/sentinel/.config --tmpfs /home/sentinel/.cache --tmpfs /home/sentinel/.bbot/cache --tmpfs /home/sentinel/.bbot/logs --tmpfs /home/sentinel/.bbot/temp \
            --cap-drop ALL --cap-add NET_RAW --cap-add SYS_CHROOT --security-opt seccomp=config/seccomp/playwright-chromium.json --hostname ci-bbot-deep \
            --entrypoint python3 cvengine-sentinel-local:ci /opt/sentinel/scripts/ci_bbot_deep_start.py 2>&1 | tail -n 12
      - name: no-new-privileges stops the raw-socket scans (why it is not set), and the scan works without it
        run: |
          scan() { docker run --rm --cap-drop ALL --cap-add NET_RAW "$@" --entrypoint nmap cvengine-sentinel-local:ci -sS -Pn -n -p 22 127.0.0.1; }
          scan | tail -n 3
          scan --security-opt no-new-privileges > "$RUNNER_TEMP/nnp.txt" 2>&1 && status=0 || status=$?
          cat "$RUNNER_TEMP/nnp.txt"
          [ "$status" != 0 ] || { echo "::error::the SYN scan worked under no-new-privileges: it can be set in docker-compose.yml now"; exit 1; }
      - name: bbot starts as the unprivileged user, in a container with a hostname of its own, and installs nothing
        # The command is the one a bbot_discovery task builds (client/bbot.py), plus --dry-run: the modules load and set up, nothing is scanned.
        # A fresh hostname matters: bbot's record of installed dependencies is keyed by it, and a start that consults the record wants sudo.
        run: docker run --rm --hostname ci-bbot-start --user 10001 --entrypoint python3 cvengine-sentinel-local:ci /opt/sentinel/scripts/ci_bbot_start.py
      - name: A deep bbot discovery (kitchen-sink) starts as the unprivileged user, three at once, and none dies in its first 10 seconds
        # What the UI's "run deep discovery" starts. kitchen-sink adds a regex entry to bbot's blacklist; a one-address network in the same blacklist made
        # bbot die in under a second with a TypeError (bbot/scanner/target.py). Not a dry run: the scan really starts, against example.com, for 10 seconds.
        run: docker run --rm --hostname ci-bbot-deep --user 10001 --entrypoint python3 cvengine-sentinel-local:ci /opt/sentinel/scripts/ci_bbot_deep_start.py
      - name: The OpenVAS bootstrap check is in the image
        run: docker run --rm --entrypoint test cvengine-sentinel-local:ci -f /opt/sentinel/scripts/ci_openvas_bootstrap.py
      - name: WPScan is the pinned version, from the locked gems, and its database is not baked in
        run: |
          docker run --rm --entrypoint wpscan cvengine-sentinel-local:ci --version | grep -F "$(grep -m1 '^ARG WPSCAN_VERSION=' Dockerfile | cut -d= -f2)"
          docker run --rm --entrypoint sh cvengine-sentinel-local:ci -c '! ls /home/sentinel/.wpscan/db/*.json >/dev/null 2>&1' \
            || { echo "::error::the image carries a WPScan database fetched at build time"; exit 1; }
      - name: The image carries no git, Go, GVM stack or docker socket
        run: |
          docker run --rm --entrypoint sh cvengine-sentinel-local:ci -c '
            bad=""
            for tool in git go gvmd openvas ospd-openvas docker; do command -v "$tool" >/dev/null 2>&1 && bad="$bad $tool"; done
            [ -e /usr/local/go ] && bad="$bad /usr/local/go"
            [ -e /root/go ] && bad="$bad /root/go"
            [ -S /var/run/docker.sock ] && bad="$bad docker.sock"
            [ -z "$bad" ] || { echo "the image carries:$bad"; exit 1; }'
      - name: The image declares its health check
        run: docker inspect --format '{{json .Config.Healthcheck.Test}}' cvengine-sentinel-local:ci | grep -F 'client.control'
