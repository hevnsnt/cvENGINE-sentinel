# The scanner library: what the Sentinel client and the cvENGINE server share (scan policy and flag builders, tool output parsers, the pure
# fingerprint readers, scope floor, result contract and its fixtures). Pure code for Python 3.12 and newer (the cvENGINE server runs 3.12 and
# imports it; CI tests 3.12 to 3.14). Its one runtime dependency is xmltodict, which reads nmap's XML. The Sentinel image installs it with
# `pip install .`; cvENGINE pins it by tag (README.md, "The scanner library").
[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "cvengine-scanner"
description = "Scan flags, output parsers, scope floor, network probes and result contract shared by the cvENGINE Sentinel and server"
dynamic = ["version"]
requires-python = ">=3.12"
license = "GPL-3.0-only"
dependencies = ["xmltodict>=1.0,<2"]  # the Sentinel image and the cvENGINE server both pin 1.0.4 in their requirements

[project.optional-dependencies]
test = ["jsonschema==4.26.0", "dnspython==2.9.0", "cryptography==50.0.2"]  # jsonschema validates the fixtures against the contract (JSON Schema 2020-12); dnspython and cryptography run the hygiene probes' tests (the library imports them only where a probe needs them: never at run time of anything else)

[project.urls]
Source = "https://github.com/hevnsnt/cvENGINE-sentinel"

[tool.setuptools]
packages = ["cvengine_scanner", "cvengine_scanner.contract", "cvengine_scanner.probes"]

[tool.setuptools.package-data]
cvengine_scanner = ["probes/subdir_apps.json", "contract/*.json", "fixtures/results/*.json", "fixtures/results/v*/*.json", "fixtures/targets/*.json", "fixtures/partials/*.json"]

# The version is the git tag (v1.2.3 or 1.2.3); a checkout without tags or without git (the Docker build context has none) gets the fallback.
[tool.setuptools_scm]
fallback_version = "0.0.0.dev0"
